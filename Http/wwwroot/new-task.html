<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建任务 - 每日任务看板</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --primary: #4f6ef7;
            --border: #e1e8f0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --sidebar-w: 230px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: #1a1d2e;
            color: #c9d1d9;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-weight: 700;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 10px;
            text-decoration: none;
            color: #b0b8c1;
        }

        .sidebar-nav a.active {
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }

        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 32px 36px;
            max-width: 800px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        @media (max-width:600px) {
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="icon">📋</div><span>任务看板</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html">📊 仪表盘</a>
            <a href="tasks.html">📋 所有任务</a>
            <a href="new-task.html" class="active">✨ 新建任务</a>
            <a href="task-detail.html">📄 任务详情</a>
        </nav>
    </aside>
    <main class="main-content">
        <h1 style="margin-bottom:24px;">✨ 新建任务</h1>
        <div class="card">
            <form onsubmit="event.preventDefault(); alert('任务已创建（演示）'); window.location.href='tasks.html';">
                <div class="form-group">
                    <label>任务标题</label>
                    <input type="text" placeholder="输入任务名称" required>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea rows="4" placeholder="任务详细描述..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>优先级</label>
                        <select>
                            <option>高</option>
                            <option selected>中</option>
                            <option>低</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>负责人</label>
                        <input type="text" placeholder="姓名">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>截止日期</label>
                        <input type="date" value="2026-08-15">
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select>
                            <option>待开始</option>
                            <option>进行中</option>
                        </select>
                    </div>
                </div>
                <div style="display:flex; gap:12px; margin-top:24px;">
                    <button type="submit" class="btn btn-primary">✅ 创建任务</button>
                    <a href="tasks.html" class="btn btn-outline">取消</a>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
