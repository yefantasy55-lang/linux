<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 每日任务看板 - 仪表盘</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --primary: #4f6ef7;
            --primary-dark: #3b54d4;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --border: #e1e8f0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.10);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --sidebar-w: 230px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: #1a1d2e;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
        }

        .sidebar-logo {
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }

        .sidebar-logo .icon {
            width: 38px;
            height: 38px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 10px;
            text-decoration: none;
            color: #b0b8c1;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all var(--transition);
        }

        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .sidebar-nav a.active {
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(79, 110, 247, 0.4);
        }

        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 32px 36px;
            max-width: 1100px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a1d2e;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all var(--transition);
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 12px;
        }

        .stat-icon.blue {
            background: #eef2ff;
            color: #4f6ef7;
        }

        .stat-icon.green {
            background: #eafaf1;
            color: #2ecc71;
        }

        .stat-icon.orange {
            background: #fef9e7;
            color: #f39c12;
        }

        .stat-icon.red {
            background: #fdedec;
            color: #e74c3c;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1d2e;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .section-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 22px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .section-header a {
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .task-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 0;
            border-bottom: 1px solid #f2f4f7;
            transition: background var(--transition);
        }

        .task-row:last-child {
            border-bottom: none;
        }

        .priority-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .priority-high {
            background: #e74c3c;
        }

        .priority-med {
            background: #f39c12;
        }

        .priority-low {
            background: #2ecc71;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .task-title a {
            color: #2c3e50;
            text-decoration: none;
        }

        .task-title a:hover {
            color: var(--primary);
        }

        .task-meta {
            font-size: 0.78rem;
            color: var(--text-light);
        }

        .task-status {
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-doing {
            background: #eef2ff;
            color: #4f6ef7;
        }

        .status-done {
            background: #eafaf1;
            color: #27ae60;
        }

        .status-todo {
            background: #fef9e7;
            color: #b8860b;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        @media (max-width: 900px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="icon">📋</div><span>任务看板</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="active">📊 仪表盘</a>
            <a href="tasks.html">📋 所有任务</a>
            <a href="new-task.html">✨ 新建任务</a>
            <a href="task-detail.html">📄 任务详情</a>
        </nav>
    </aside>
    <main class="main-content">
        <div class="page-header">
            <h1>📊 仪表盘</h1>
            <p class="subtitle">欢迎回来！这是你今日的任务概览。</p>
        </div>
        <div class="stats-grid">
            <a href="tasks.html" class="stat-card">
                <div class="stat-icon blue">📝</div>
                <div class="stat-number">12</div>
                <div class="stat-label">全部任务</div>
            </a>
            <a href="tasks.html" class="stat-card">
                <div class="stat-icon orange">⏳</div>
                <div class="stat-number">5</div>
                <div class="stat-label">进行中</div>
            </a>
            <a href="tasks.html" class="stat-card">
                <div class="stat-icon green">✅</div>
                <div class="stat-number">6</div>
                <div class="stat-label">已完成</div>
            </a>
            <a href="tasks.html" class="stat-card">
                <div class="stat-icon red">🔴</div>
                <div class="stat-number">1</div>
                <div class="stat-label">已逾期</div>
            </a>
        </div>
        <div class="section-card">
            <div class="section-header">
                <h3>📌 最近的任务</h3><a href="tasks.html">查看全部 →</a>
            </div>
            <div class="task-row"><span class="priority-dot priority-high"></span>
                <div class="task-info">
                    <div class="task-title"><a href="task-detail.html">完成季度财务报告</a></div>
                    <div class="task-meta">截止：2026-08-12 · 张明</div>
                </div><span class="task-status status-doing">进行中</span>
            </div>
            <div class="task-row"><span class="priority-dot priority-high"></span>
                <div class="task-info">
                    <div class="task-title"><a href="task-detail.html">修复登录页面 Bug</a></div>
                    <div class="task-meta">截止：2026-08-10 · 李华</div>
                </div><span class="task-status status-doing">进行中</span>
            </div>
            <div class="task-row"><span class="priority-dot priority-med"></span>
                <div class="task-info">
                    <div class="task-title"><a href="task-detail.html">设计新版官网首页</a></div>
                    <div class="task-meta">截止：2026-08-15 · 王芳</div>
                </div><span class="task-status status-todo">待开始</span>
            </div>
            <div class="task-row"><span class="priority-dot priority-low"></span>
                <div class="task-info">
                    <div class="task-title"><a href="task-detail.html">整理团队文档</a></div>
                    <div class="task-meta">截止：2026-08-20 · 陈静</div>
                </div><span class="task-status status-done">已完成</span>
            </div>
        </div>
        <div style="display:flex; gap:12px;"><a href="new-task.html" class="btn btn-primary">＋ 新建任务</a><a
                href="tasks.html" class="btn btn-outline">📋 所有任务</a></div>
    </main>
</body>

</html>
