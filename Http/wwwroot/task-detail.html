<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务详情 - 每日任务看板</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --primary: #4f6ef7;
            --danger: #e74c3c;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --border: #e1e8f0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --sidebar-w: 230px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: #1a1d2e;
            color: #c9d1d9;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-weight: 700;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 10px;
            text-decoration: none;
            color: #b0b8c1;
        }

        .sidebar-nav a.active {
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }

        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 32px 36px;
            max-width: 900px;
        }

        .breadcrumb {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f2f4f7;
        }

        .meta-item .label {
            color: var(--text-light);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-danger {
            background: #fff;
            color: var(--danger);
            border: 1.5px solid var(--danger);
        }

        .tag {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tag-blue {
            background: #eef2ff;
            color: #4f6ef7;
        }

        @media (max-width:700px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="icon">📋</div><span>任务看板</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html">📊 仪表盘</a>
            <a href="tasks.html">📋 所有任务</a>
            <a href="new-task.html">✨ 新建任务</a>
            <a href="task-detail.html" class="active">📄 任务详情</a>
        </nav>
    </aside>
    <main class="main-content">
        <div class="breadcrumb"><a href="index.html">仪表盘</a> / <a href="tasks.html">所有任务</a> / 任务详情</div>
        <h1 style="margin-bottom:20px;">📌 完成季度财务报告</h1>
        <div class="detail-grid">
            <div class="card">
                <h3>描述</h3>
                <p style="margin-top:10px; color:#4a5568;">汇总Q3各部门财务数据，制作PPT并提交至管理层审核。需要包含同比分析及预算执行情况。</p>
                <h3 style="margin-top:20px;">子任务</h3>
                <ul style="margin-top:8px; padding-left:20px; color:#2c3e50;">
                    <li>收集销售数据 ✓</li>
                    <li>整理成本报表</li>
                    <li>制作分析图表</li>
                </ul>
            </div>
            <div class="card">
                <div class="meta-item"><span class="label">状态</span><span class="tag tag-blue">进行中</span></div>
                <div class="meta-item"><span class="label">优先级</span><span style="color:#e74c3c; font-weight:600;">🔴
                        高</span></div>
                <div class="meta-item"><span class="label">负责人</span>张明</div>
                <div class="meta-item"><span class="label">截止日期</span>2026-08-12</div>
                <div class="meta-item"><span class="label">创建时间</span>2026-08-02</div>
            </div>
        </div>
        <div style="display:flex; gap:12px; margin-top:20px;">
            <a href="tasks.html" class="btn btn-outline">← 返回列表</a>
            <a href="new-task.html" class="btn btn-primary">✏️ 编辑任务</a>
        </div>
    </main>
</body>

</html>
