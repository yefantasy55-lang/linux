<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 所有任务 - 每日任务看板</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --primary: #4f6ef7;
            --primary-dark: #3b54d4;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --border: #e1e8f0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --transition: 0.2s;
            --sidebar-w: 230px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: #1a1d2e;
            color: #c9d1d9;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
        }

        .sidebar-logo {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }

        .sidebar-logo .icon {
            width: 38px;
            height: 38px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 10px;
            text-decoration: none;
            color: #b0b8c1;
            font-weight: 500;
            transition: all var(--transition);
        }

        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .sidebar-nav a.active {
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }

        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 32px 36px;
            max-width: 1100px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .section-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 22px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .task-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 0;
            border-bottom: 1px solid #f2f4f7;
        }

        .task-row:last-child {
            border-bottom: none;
        }

        .priority-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .priority-high {
            background: #e74c3c;
        }

        .priority-med {
            background: #f39c12;
        }

        .priority-low {
            background: #2ecc71;
        }

        .task-info {
            flex: 1;
        }

        .task-title a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
        }

        .task-title a:hover {
            color: var(--primary);
        }

        .task-meta {
            font-size: 0.78rem;
            color: var(--text-light);
        }

        .task-status {
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-doing {
            background: #eef2ff;
            color: #4f6ef7;
        }

        .status-done {
            background: #eafaf1;
            color: #27ae60;
        }

        .status-todo {
            background: #fef9e7;
            color: #b8860b;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: #fff;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="icon">📋</div><span>任务看板</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html">📊 仪表盘</a>
            <a href="tasks.html" class="active">📋 所有任务</a>
            <a href="new-task.html">✨ 新建任务</a>
            <a href="task-detail.html">📄 任务详情</a>
        </nav>
    </aside>
    <main class="main-content">
        <div class="page-header">
            <h1>📋 所有任务</h1>
            <p class="subtitle" style="color:#7f8c8d;">共 12 个任务，点击标题查看详情</p>
        </div>
        <div class="filter-bar">
            <select>
                <option>全部状态</option>
                <option>进行中</option>
                <option>已完成</option>
                <option>待开始</option>
            </select>
            <input type="text" placeholder="搜索任务...">
            <a href="new-task.html" class="btn btn-primary">＋ 新建任务</a>
        </div>
        <div class="section-card">
            <div class="task-row"><span class="priority-dot priority-high"></span>
                <div class="task-info">
                    <div class="task-title"><a href="task-detail.html">完成季度财务报告</a></div>
                    <div class="task-meta">截止：2026-08-12 · 张明</div>
                </div><span class="task-status status-doing">进行中</span>
            </div>
            <div class="task-row"><span class="priority-dot priority-high"></span>
                <div class="task-info">
                    <div class="task-title"><a href="task-detail.html">修复登录页面 Bug</a></div>
                    <div class="task-meta">截止：2026-08-10 · 李华</div>
                </div><span class="task-status status-doing">进行中</span>
            </div>
            <div class="task-row"><span class="priority-dot priority-med"></span>
                <div class="task-info">
                    <div class="task-title"><a href="task-detail.html">设计新版官网首页</a></div>
                    <div class="task-meta">截止：2026-08-15 · 王芳</div>
                </div><span class="task-status status-todo">待开始</span>
            </div>
            <div class="task-row"><span class="priority-dot priority-low"></span>
                <div class="task-info">
                    <div class="task-title"><a href="task-detail.html">整理团队文档</a></div>
                    <div class="task-meta">截止：2026-08-20 · 陈静</div>
                </div><span class="task-status status-done">已完成</span>
            </div>
            <div class="task-row"><span class="priority-dot priority-med"></span>
                <div class="task-info">
                    <div class="task-title"><a href="task-detail.html">客户需求评审会议</a></div>
                    <div class="task-meta">截止：2026-08-11 · 赵岩</div>
                </div><span class="task-status status-doing">进行中</span>
            </div>
        </div>
    </main>
</body>

</html>
